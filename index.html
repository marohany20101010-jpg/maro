<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Clone AI</title>
    <!-- استيراد الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #343541;
            color: #ececf1;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* القائمة الجانبية (Sidebar) */
        .sidebar {
            width: 260px;
            background-color: #202123;
            display: flex;
            flex-direction: column;
            padding: 10px;
            transition: transform 0.3s ease;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            color: #d9d9e3;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* منطقة الشات الأساسية */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #343541;
            position: relative;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            background: #343541;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px; /* مساحة عشان خانة الكتابة */
        }

        .message-row {
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .message-row.ai {
            background-color: #444654;
        }

        .message-content {
            width: 100%;
            max-width: 750px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
            font-size: 15px;
            line-height: 1.6;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .user-avatar {
            background-color: #5436da;
            color: white;
        }

        .ai-avatar {
            background-color: #10a37f;
            color: white;
        }

        .text {
            flex: 1;
            overflow-x: auto;
        }

        /* صندوق الإدخال السفلي */
        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(180deg, rgba(53,53,65,0) 0%, #343541 50%);
            display: flex;
            justify-content: center;
        }

        .input-box {
            width: 100%;
            max-width: 750px;
            background-color: #40414f;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            resize: none;
            max-height: 200px;
            outline: none;
            padding: 5px;
            line-height: 1.4;
        }

        .send-btn {
            background-color: #19c37d;
            color: white;
            border: none;
            border-radius: 6px;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:disabled {
            background-color: #565869;
            cursor: not-allowed;
        }

        /* شاشة الترحيب الافتراضية */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

        .welcome-screen h1 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* للشاشات الصغيرة (الموبايل) */
        @media (max-width: 768px) {
            .sidebar {
                display: none; /* ممكن نخفي السايدبار على الموبايل لتجربة أسهل */
            }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <button class="button new-chat-btn" onclick="location.reload()">
            <i class="fa-solid fa-plus"></i> محادثة جديدة
        </button>
        <div class="history-list">
            <div class="history-item">موقع الذكاء الاصطناعي الجديد</div>
            <div class="history-item">محادثة تجريبية 1</div>
        </div>
    </div>

    <!-- واجهة الشات -->
    <div class="chat-container">
        <div class="chat-header">
            ChatGPT Assistant ⚡
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- شاشة الترحيب تظهر في الأول -->
            <div class="welcome-screen" id="welcomeScreen">
                <h1>كيف يمكنني مساعدتك اليوم؟</h1>
            </div>
        </div>

        <!-- خانة الكتابة -->
        <div class="input-area">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="أرسل رسالة إلى الذكاء الاصطناعي..."></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // رابط الـ Worker الخاص بك
        const WORKER_URL = 'https://myaisite.marohany20101010.workers.dev/';

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');

        // جعل خانة الكتابة تكبر تلقائياً حسب الكلام
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // إرسال بالضغط على Enter (بدون Shift)
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // إخفاء شاشة الترحيب لو أول رسالة
            if (welcomeScreen) {
                welcomeScreen.style.display = 'none';
            }

            // مسح خانة الإدخال وإرجاع حجمها الطبيعي
            userInput.value = '';
            userInput.style.height = 'auto';

            // إضافة رسالة المستخدم للشات
            appendMessage(text, 'user');

            // تعطيل الزر مؤقتاً أثناء الانتظار
            sendBtn.disabled = true;

            // إضافة رسالة "جاري الكتابة..." الخاصة بالذكاء الاصطناعي
            const loadingId = appendMessage('جاري التفكير...', 'ai', true);

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // إزالة رسالة التحميل
                document.getElementById(loadingId).remove();

                if (data.reply) {
                    appendMessage(data.reply, 'ai');
                } else if (data.error) {
                    appendMessage('عذراً، حدث خطأ: ' + data.error, 'ai');
                } else {
                    appendMessage('رد غير متوقع من السيرفر.', 'ai');
                }

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('فشل الاتصال بالسيرفر. تأكد من الإنترنت أو الرابط.', 'ai');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function appendMessage(text, sender, isLoading = false) {
            const messageId = 'msg-' + Date.now() + Math.random();
            const rowDiv = document.createElement('div');
            rowDiv.className = `message-row ${sender}`;
            rowDiv.id = messageId;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            const avatarDiv = document.createElement('div');
            avatarDiv.className = `avatar ${sender === 'user' ? 'user-avatar' : 'ai-avatar'}`;
            avatarDiv.innerHTML = sender === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

            const textDiv = document.createElement('div');
            textDiv.className = 'text';
            
            if (isLoading) {
                textDiv.innerHTML = `<em>${text}</em>`;
            } else {
                // تحويل الأسطر الجديدة لـ HTML مظبوطة
                textDiv.innerText = text;
            }

            contentDiv.appendChild(avatarDiv);
            contentDiv.appendChild(textDiv);
            rowDiv.appendChild(contentDiv);
            chatMessages.appendChild(rowDiv);

            // نزول الشات لأسفل تلقائياً
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return messageId;
        }
    </script>
</body>
</html>
